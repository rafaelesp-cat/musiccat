<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSICCAT Beta</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #121212;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px;
      background: #191919;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: #1db954;
      color: black;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    header h1 {
      font-size: 24px;
    }

    main {
      padding: 25px;
      padding-bottom: 120px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .welcome {
      background: linear-gradient(135deg, #1db954, #0b6b35);
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 25px;
    }

    .welcome h2 {
      color: black;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #062b16;
    }

    .song {
      background: #202020;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cover {
      width: 55px;
      height: 55px;
      background: #333;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .song-info {
      flex: 1;
    }

    .song-info p {
      color: #aaa;
      margin-top: 5px;
      font-size: 14px;
    }

    button {
      border: none;
      background: #1db954;
      color: black;
      font-weight: bold;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #181818;
      display: flex;
      justify-content: space-around;
      padding: 15px 5px;
      border-top: 1px solid #333;
    }

    nav button {
      background: transparent;
      color: white;
      width: auto;
      height: auto;
      border-radius: 0;
      font-size: 13px;
    }

    nav button:hover {
      color: #1db954;
      transform: none;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">M</div>
    <h1>MUSICCAT</h1>
  </header>

  <main>
    <div class="welcome">
      <h2>Bienvenido a MUSICCAT</h2>
      <p>Tu música. Tu estilo.</p>
    </div>

    <h2>Tu música</h2>

    <div class="song">
      <div class="cover">♪</div>
      <div class="song-info">
        <strong>Canción de prueba</strong>
        <p>MUSICCAT</p>
      </div>
      <button onclick="playSong()">▶</button>
    </div>

    <div class="song">
      <div class="cover">♫</div>
      <div class="song-info">
        <strong>Mi primera playlist</strong>
        <p>MUSICCAT Beta</p>
      </div>
      <button onclick="playSong()">▶</button>
    </div>
  </main>

  <nav>
    <button>🏠<br>Inicio</button>
    <button>🔎<br>Buscar</button>
    <button>📚<br>Biblioteca</button>
    <button>⚙️<br>Ajustes</button>
  </nav>

  <script>
    function playSong() {
      alert("Reproductor MUSICCAT próximamente 🎵");
    }
  </script>

</body>
</html>
